# Himma — CI (docs/38 §11; docs/36 IN-11/SE-03): every push/PR runs the
# repository's own verification commands unchanged (backend on a real
# PostgreSQL service, the three frontends, contract suites), the dependency
# audit policy, and a production Docker build of the ONE backend image.
# Nothing here deploys and nothing here holds a credential.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  backend:
    name: backend (tsc · lint · Jest on PostgreSQL · db:verify)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: himma
          POSTGRES_PASSWORD: himma
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U himma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: himma
      PGPASSWORD: himma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - name: Jest (real PostgreSQL; each suite provisions its own himma_test_* database)
        run: npm test
        working-directory: backend
        env:
          NODE_ENV: test
      - name: db:migrate + db:verify on a fresh database (the migration job contract)
        working-directory: backend
        env:
          NODE_ENV: development
          PGDATABASE: himma_ci_verify
        run: |
          psql -h localhost -U himma -d postgres -c 'CREATE DATABASE himma_ci_verify'
          npm run db:migrate
          npm run db:verify
      - name: dependency audit policy (docs/36 SE-03 — high/critical fail the build)
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend

  customer-app:
    name: customer app (tsc · lint · Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  portals:
    name: ${{ matrix.app }} (tsc · lint · Jest · contract on PostgreSQL)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [portal, admin]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: himma
          POSTGRES_PASSWORD: himma
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U himma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: himma
      PGPASSWORD: himma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            ${{ matrix.app }}/package-lock.json
            backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: ${{ matrix.app }}
      - run: npm run typecheck
        working-directory: ${{ matrix.app }}
      - run: npm run lint
        working-directory: ${{ matrix.app }}
      - run: npm test -- --ci
        working-directory: ${{ matrix.app }}
      - run: npm run test:contract
        working-directory: ${{ matrix.app }}
        env:
          NODE_ENV: test

  backend-image:
    name: backend image (production Dockerfile build · scan)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the ONE backend image (not pushed here)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: himma-backend:ci
          build-args: |
            HIMMA_GIT_SHA=${{ github.sha }}
            HIMMA_BUILD_DATE=${{ github.event.head_commit.timestamp || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: image invariants (non-root, one entrypoint, no .env, no dev executables)
        run: |
          set -euo pipefail
          user="$(docker inspect -f '{{.Config.User}}' himma-backend:ci)"; [[ "$user" == "himma:himma" ]]
          docker run --rm --entrypoint sh himma-backend:ci -c 'test ! -e /app/.env && test ! -e /app/scripts/dev-server.ts && test ! -d /app/test && test -s /etc/himma/certs/rds-global-bundle.pem && test -f /app/scripts/start-api.ts && test -f /app/scripts/start-worker.ts && test -f /app/scripts/start-maintenance.ts && test -f /app/scripts/db-migrate.ts'
      - name: every shipped invocation loads from production dependencies alone and refuses without the fail-closed contract (read-only root, no DATABASE_URL → exit 1 naming the variable)
        run: |
          set -euo pipefail
          invocation() {
            local role="$1"; shift
            local out code
            set +e
            out="$(docker run --rm --read-only -e NODE_ENV=production -e RUNTIME_ROLE="$role" himma-backend:ci "$@" 2>&1)"; code=$?
            set -e
            echo "[$role $*] exit=$code: $(echo "$out" | tail -1 | cut -c1-160)"
            [[ $code -eq 1 ]] && echo "$out" | grep -q DATABASE_URL && ! echo "$out" | grep -q MODULE_NOT_FOUND
          }
          invocation api scripts/start-api.ts
          invocation worker scripts/start-worker.ts
          invocation maintenance scripts/start-maintenance.ts retention.all
          invocation migrate scripts/db-migrate.ts
          invocation migrate scripts/db-verify.ts
          invocation migrate scripts/db-provision-runtime-roles.ts
      - name: vulnerability scan (docs/36 SE-03 — critical/high fail)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: himma-backend:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  terraform:
    name: terraform (fmt · validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - run: terraform fmt -recursive -check infra/terraform
      - run: terraform -chdir=infra/terraform/stacks/himma init -backend=false -input=false && terraform -chdir=infra/terraform/stacks/himma validate
      - run: terraform -chdir=infra/terraform/bootstrap init -backend=false -input=false && terraform -chdir=infra/terraform/bootstrap validate
